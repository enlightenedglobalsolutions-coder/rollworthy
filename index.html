  window.addEventListener('load', function () {

      reg.addEventListener('updatefound', function () {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {

<style>
:root{
  --bg:#F4F1EA; --surface:#FFFFFF; --surface2:#ECE7DC;
  --text:#22262E; --muted:#5C6270; --line:#D8D2C4;
  --blue:#185FA5; --blue-ink:#FFFFFF;
  --gold:#B8860B; --gold-soft:#8a6a1f;
  --ok:#1E7D3C; --warn:#B26A00; --bad:#B3261E; --bad-ink:#fff;
  --shadow:0 1px 3px rgba(0,0,0,.12);
}
[data-theme="dark"]{
  --bg:#14171D; --surface:#1A1E25; --surface2:#232833;
  --text:#EDE8DC; --muted:#9AA0AC; --line:#333A46;
  --blue:#3D82C4; --blue-ink:#0E1420;
  --gold:#D6A84B; --gold-soft:#EEC670;
  --ok:#4CC072; --warn:#E0A23F; --bad:#E5655C; --bad-ink:#14171D;
  --shadow:0 1px 3px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(env(safe-area-inset-bottom) + 12px)}
header.app{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:2px solid var(--gold);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
header.app h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.3px;flex:1}
header.app h1 small{display:block;font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.5px}
.hbtn{background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;min-width:44px;min-height:44px;
  font-size:15px;display:flex;align-items:center;justify-content:center;padding:0 10px}
main{padding:14px;max-width:640px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 8px;font-size:17px}
.card h3{margin:12px 0 6px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border-radius:14px;
  border:none;font-size:18px;font-weight:700;margin-bottom:12px;box-shadow:var(--shadow)}
.big.out{background:var(--blue);color:var(--blue-ink)}
.big.in{background:var(--surface);color:var(--text);border:2px solid var(--blue)}
.btn{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);
  font-size:15px;padding:8px 14px}
.btn.primary{background:var(--blue);color:var(--blue-ink);border-color:var(--blue);font-weight:600}
.btn.gold{background:transparent;color:var(--gold);border:1.5px solid var(--gold);font-weight:600}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:36px;font-size:13px;padding:4px 10px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack>*+*{margin-top:10px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=number],input[type=password],select,textarea{
  width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);
  color:var(--text);font-size:16px;padding:8px 12px}
textarea{min-height:70px}
.vrow{display:flex;align-items:center;gap:10px;padding:12px 10px;border-bottom:1px solid var(--line);width:100%;
  background:none;border-left:none;border-right:none;border-top:none;color:var(--text);text-align:left;font-size:16px}
.vrow:last-child{border-bottom:none}
.vrow .unit{font-weight:700;font-size:17px;min-width:64px;color:var(--blue)}
[data-theme="dark"] .vrow .unit{color:var(--gold-soft)}
.vrow .sub{font-size:13px;color:var(--muted)}
.tag{font-size:11px;border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:1px 6px;letter-spacing:.4px}
.item{padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .lbl{font-size:15px;margin-bottom:6px}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);font-size:14px;font-weight:600}
.seg button.on-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on-def{background:var(--bad);border-color:var(--bad);color:var(--bad-ink)}
.seg button.on-min{background:var(--warn);border-color:var(--warn);color:#fff}
.defbox{margin-top:8px;padding:10px;border:1px dashed var(--bad);border-radius:10px}
.fuel{display:flex;gap:6px}
.fuel button{flex:1;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-weight:700}
.fuel button.on{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.photo-thumb{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.banner{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:50;
  background:var(--surface);border:1.5px solid var(--gold);border-radius:12px;padding:12px;display:none;box-shadow:var(--shadow)}
.banner.show{display:block}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 76px);
  z-index:60;background:var(--text);color:var(--surface);padding:10px 16px;border-radius:999px;
  font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .18s}
#toast.show{opacity:1}
.hbtn.share svg{width:20px;height:20px;display:block;margin:auto}
.sg{display:inline-flex;width:18px;height:18px}
.alertbar{border-radius:12px;padding:12px;margin-bottom:14px;font-weight:600}
.alertbar.major{background:var(--bad);color:var(--bad-ink)}
.alertbar.softwarn{border:1.5px solid var(--warn);color:var(--warn)}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.tabs button{min-height:42px;padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:var(--blue-ink);font-weight:600}
.rec{padding:10px 0;border-bottom:1px solid var(--line)}
.rec .top{display:flex;justify-content:space-between;font-size:15px}
.rec .sub{font-size:13px;color:var(--muted)}
.pill{font-size:11px;border-radius:6px;padding:2px 7px;font-weight:700}
.pill.out{background:var(--blue);color:var(--blue-ink)}
.pill.in{border:1px solid var(--blue);color:var(--blue)}
.pill.def{background:var(--bad);color:var(--bad-ink)}
.pill.res{background:var(--ok);color:#fff}
.info-i{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;
  border:1.5px solid var(--gold);color:var(--gold);font-size:12px;font-style:italic;font-weight:700;margin-left:6px;vertical-align:middle;background:none}
body.expert .info-i{display:none}
.muted{color:var(--muted);font-size:13px}
.center{text-align:center}
hr.soft{border:none;border-top:1px solid var(--line);margin:14px 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
#modal .sheet{background:var(--surface);border-radius:16px 16px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);
  width:100%;max-width:640px;max-height:80vh;overflow:auto}
#camWrap{position:fixed;inset:0;background:#000;z-index:70;display:none;flex-direction:column}
#camWrap.show{display:flex}
#camWrap video{flex:1;object-fit:cover;width:100%}
#camWrap .bar{padding:14px;padding-bottom:calc(env(safe-area-inset-bottom) + 14px);background:#000;text-align:center}
.sticker-sheet{display:none}
@media print{
  body *{visibility:hidden}
  body{background:#fff}
  .sticker-sheet,.sticker-sheet *{visibility:visible}
  .sticker-sheet{display:block;position:absolute;top:0;left:0;width:100%}
  .sticker{border:2px solid #000;border-radius:10px;padding:14px;margin:0 0 18px;page-break-inside:avoid;text-align:center;width:280px}
  .sticker .u{font-size:34px;font-weight:800;margin:6px 0}
  .sticker .c{font-size:13px}
  .sticker svg{width:170px;height:170px}
}
.q-grid{display:flex;justify-content:center;margin:8px 0}
footer.egs{text-align:center;color:var(--muted);font-size:12px;padding:20px 0 8px}
</style>
</head>
<body>
<div id="app"><main><div class="card center"><p>Loading Rollworthy…</p></div></main></div>

<div id="updateBanner" class="banner">
  <div class="row between">
    <div><strong>Update ready</strong><div class="muted">A new version of Rollworthy is available.</div></div>
    <button class="btn primary" data-action="applyUpdate">Refresh</button>
  </div>
</div>
<div id="nudgeBanner" class="banner"></div>
<div id="installBanner" class="banner"></div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="modal"><div class="sheet" id="modalBody"></div></div>

<div id="camWrap">
  <video id="camVideo" playsinline muted></video>
  <div class="bar"><button class="btn" data-action="closeScan">Cancel</button>
  <div style="color:#fff;font-size:13px;margin-top:8px">Point the camera at the dash sticker</div></div>
</div>

<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
<input type="file" id="importInput" accept="application/json,.json" style="display:none">

<div id="stickerSheet" class="sticker-sheet"></div>

<script>
/* ---- vendored QR encoder (MIT, Kazuhiko Arase) ---- */
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

/* ---------- IndexedDB photos ---------- */
var dbP=null;

    var q=indexedDB.open(DB_NAME,1);
    q.onupgradeneeded=function(){q.result.createObjectStore(DB_STORE);};
    q.onsuccess=function(){res(q.result);};
    q.onerror=function(){rej(q.error);};
  });
  return dbP;
}
function putPhoto(id,blob){return db().then(function(d){return new Promise(function(res,rej){
  var tx=d.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(blob,id);
  tx.oncomplete=function(){res();};tx.onerror=function(){rej(tx.error);};});});}
function getPhoto(id){return db().then(function(d){return new Promise(function(res){
  var q=d.transaction(DB_STORE).objectStore(DB_STORE).get(id);

  return new Promise(function(res){
    var img=new Image();
    img.onload=function(){
      var max=1000,w=img.width,h=img.height;
      if(w>max||h>max){var k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
      var c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(function(b){URL.revokeObjectURL(img.src);res(b);},'image/jpeg',0.8);
    };
    img.onerror=function(){res(null);};
    img.src=URL.createObjectURL(file);
  });
}
function blobToDataURL(b){return new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){res(null);};r.readAsDataURL(b);});}

/* ---------- flows ---------- */
function go(name,extra){view=Object.assign({name:name},extra||{});render();}

function pinGate(){
  var p=prompt('Manager PIN:');
  if(p===null)return false;
  if(p!==cfg.managerPin){alert('Wrong PIN.');return false;}
  return true;
}

function startDraft(type,vehicleId){
  var v=vehById(vehicleId);
  draft={id:uid(),schema:1,type:type,ts:Date.now(),vehicleId:v.id,unit:v.unit,plate:v.plate,cls:v.cls,
    driver:localStorage.getItem(LS_DRIVER)||'',odometer:null,odoPhotoId:null,fuel:null,
    items:checklistFor(v,type).map(function(l){return{label:l,status:null,note:'',photoId:null};}),
    notes:'',appVersion:window.EGS_VERSION,synced:false,shared:false};
  go('inspect');
}

function collectDraftInputs(){
  var o=document.getElementById('odoIn'); if(o&&o.value!=='')draft.odometer=parseInt(o.value,10);
  var n=document.getElementById('genNotes'); if(n)draft.notes=n.value;
  var notes=document.querySelectorAll('textarea[data-role=itemNote]');
  Array.prototype.forEach.call(notes,function(t){draft.items[parseInt(t.getAttribute('data-i'),10)].note=t.value;});
}

function validateDraft(){
  if(!draft.driver){alert('Select your driver name on the home screen first.');return false;}
  if(draft.odometer==null||isNaN(draft.odometer)){alert('Enter the odometer reading.');return false;}
  var last=lastOdo(draft.vehicleId);
  if(last!=null&&draft.odometer<last){
    if(!confirm('Odometer ('+draft.odometer+') is LOWER than the last recorded reading ('+last+'). Save anyway?'))return false;
  }
  if(cfg.settings.requireOdoPhoto&&!draft.odoPhotoId){alert('An odometer photo is required.');return false;}
  if(!draft.fuel){alert('Tap the fuel level.');return false;}
  for(var i=0;i<draft.items.length;i++){var it=draft.items[i];
    if(!it.status){alert('Answer every checklist item — "'+it.label+'" is blank.');return false;}
    if(it.status!=='ok'){
      if(!it.note.trim()){alert('Add a note describing the defect on "'+it.label+'".');return false;}
      if(cfg.settings.requireDefectPhoto&&!it.photoId){alert('Add a photo of the defect on "'+it.label+'".');return false;}
    }}
  return true;
}

/* ---------- share / export / import ---------- */
function dl(name,text,type){
  var b=new Blob([text],{type:type||'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},400);
}
function shareOrDl(name,text,type){
  var b=new Blob([text],{type:type||'application/json'});
  var f=new File([b],name,{type:b.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    navigator.share({files:[f],title:name}).catch(function(){});
  }else dl(name,text,type);
}
function packRecords(list){
  var pids=[];
  list.forEach(function(r){if(r.odoPhotoId)pids.push(r.odoPhotoId);(r.items||[]).forEach(function(i){if(i.photoId)pids.push(i.photoId);});});
  return Promise.all(pids.map(function(id){return getPhoto(id).then(function(b){return b?blobToDataURL(b).then(function(u){return[id,u];}):null;});}))
  .then(function(pairs){
    var photos={};pairs.forEach(function(p){if(p&&p[1])photos[p[0]]=p[1];});
    return JSON.stringify({kind:'ft-records',schema:1,company:cfg.company,exportedAt:Date.now(),records:list,photos:photos});
  });
}
function shareRecords(list,markShared){
  packRecords(list).then(function(json){
    shareOrDl('rollworthy-records-'+todayStr()+'.json',json);
    if(markShared){list.forEach(function(r){r.shared=true;});saveRecords();render();}
  });
}
function exportCSV(){
  var head='date,time,type,unit,plate,class,driver,odometer_km,fuel,defects,notes,record_id\n';
  var lines=records.slice().sort(function(a,b){return a.ts-b.ts;}).map(function(r){
    var d=new Date(r.ts);
    var defs=(r.items||[]).filter(function(i){return i.status&&i.status!=='ok';})
      .map(function(i){return i.label+(i.note?' ('+i.note+')':'');}).join('; ');
    function q(s){s=String(s==null?'':s);return '"'+s.replace(/"/g,'""')+'"';}
    return [d.toLocaleDateString(),d.toLocaleTimeString(),r.type,q(r.unit),q(r.plate||''),r.cls,q(r.driver),r.odometer,q(r.fuel||''),q(defs),q(r.notes||''),r.id].join(',');
  }).join('\n');
  dl('rollworthy-report-'+todayStr()+'.csv',head+lines,'text/csv');
  cfg.settings.lastBackupAt=Date.now();saveCfg();
}
function exportSetup(){
  var out={kind:'ft-setup',schema:1,company:cfg.company,vehicles:cfg.vehicles,drivers:cfg.drivers,
    checklist:cfg.checklist,settings:{requireOdoPhoto:cfg.settings.requireOdoPhoto,requireDefectPhoto:cfg.settings.requireDefectPhoto}};
  shareOrDl('rollworthy-setup-'+todayStr()+'.json',JSON.stringify(out));
}
function backupAll(){
  packRecords(records).then(function(json){
    var pack=JSON.parse(json);
    var out={kind:'ft-backup',schema:1,cfg:cfg,records:records,resolutions:resolutions,photos:pack.photos,exportedAt:Date.now()};
    dl('rollworthy-backup-'+todayStr()+'.json',JSON.stringify(out));
    cfg.settings.lastBackupAt=Date.now();saveCfg();
    var nb=document.getElementById('nudgeBanner');if(nb)nb.classList.remove('show');
  });
}
function importPhotos(map){
  var jobs=[];Object.keys(map||{}).forEach(function(id){var b=dataURLtoBlob(map[id]);if(b)jobs.push(putPhoto(id,b));});
  return Promise.all(jobs);
}
function handleImport(file){
  var r=new FileReader();
  r.onload=function(){
    var data;try{data=JSON.parse(r.result);}catch(e){alert('That file could not be read.');return;}
    if(data.kind==='ft-setup'&&data.schema===1){
      if(cfg&&!confirm('Replace this phone\u2019s company setup with "'+data.company+'"? Records are kept.'))return;
      var pin=cfg?cfg.managerPin:null;
      cfg={schema:1,company:data.company,managerPin:pin||'0000',vehicles:data.vehicles||[],drivers:data.drivers||[],
        checklist:data.checklist||{light:DEFAULT_LIGHT.slice(),nsc:DEFAULT_NSC.slice(),checkin:DEFAULT_IN.slice()},
        settings:Object.assign({theme:'system',beginner:true,requireOdoPhoto:true,requireDefectPhoto:true,lastBackupAt:null},data.settings||{})};
      saveCfg();alert('Company setup imported: '+data.company);go('home');
    }else if(data.kind==='ft-records'&&data.schema===1){
      var have={};records.forEach(function(x){have[x.id]=1;});
      var added=0;(data.records||[]).forEach(function(x){if(!have[x.id]){records.push(x);added++;}});
      saveRecords();
      importPhotos(data.photos).then(function(){alert(added+' new record'+(added===1?'':'s')+' imported ('+((data.records||[]).length-added)+' already present).');render();});
    }else if(data.kind==='ft-backup'&&data.schema===1){
      if(!confirm('Restore backup from '+(data.cfg&&data.cfg.company||'?')+'? This REPLACES all settings and records on this phone.'))return;
      if(!confirm('Are you sure? This cannot be undone.'))return;
      cfg=data.cfg;records=data.records||[];resolutions=data.resolutions||{};
      saveCfg();saveRecords();saveRes();
      importPhotos(data.photos).then(function(){alert('Backup restored.');go('home');});
    }else alert('Not a Rollworthy file.');
  };
  r.readAsText(file);
}

/* ---------- nudge ---------- */
/* ---------- install prompt ---------- */
var deferredInstall=null, installShown=false;

/* iOS/iPadOS Safari never fires beforeinstallprompt. navigator.standalone is a
   WebKit-only property, so its presence is a feature test for that family —
   not user-agent sniffing, which lies (iPadOS reports itself as a Mac). */
function isIOSSafari(){return 'standalone' in navigator;}
function isInstalled(){
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
}
/* One banner at a time. Install always yields to the update banner and the
   backup nudge — both matter more than an install suggestion. */
function bannerBusy(){
  var u=document.getElementById('updateBanner'), n=document.getElementById('nudgeBanner');
  return !!((u&&u.classList.contains('show'))||(n&&n.classList.contains('show')));
}
function maybeShowInstall(){
  if(installShown)return;
  /* first-run landing counts as home for the install banner */
  if(cfg&&view.name!=='home')return;         /* never mid-inspection */
  if(isInstalled())return;                   /* already on the home screen */
  if(localStorage.getItem(LS_INSTALL))return;/* dismissed before */
  if(bannerBusy())return;
  if(!deferredInstall&&!isIOSSafari())return;/* nothing to offer on this browser */
  showInstallBanner(deferredInstall?'prompt':'ios');
}
function showInstallBanner(mode){
  installShown=true;
  var b=document.getElementById('installBanner');
  if(!b)return;
  b.innerHTML='<div class="row between"><div><strong>Add '+esc(APP_NAME)+' to your home screen</strong>'+
    '<div class="muted">'+(mode==='prompt'
      ? 'Opens full screen and works with no signal.'
      : 'Tap Share, then \u201cAdd to Home Screen\u201d.')+'</div></div>'+
    '<div class="row">'+
      (mode==='prompt'?'<button class="btn small primary" data-action="installGo">Add</button>':'')+
      '<button class="btn small" data-action="installDismiss">Not now</button>'+
    '</div></div>';
  b.classList.add('show');
}
function hideInstallBanner(){
  var b=document.getElementById('installBanner');
  if(b)b.classList.remove('show');
}
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();          /* keep Chrome's own UI out of the way */
  deferredInstall=e;
  maybeShowInstall();
});
window.addEventListener('appinstalled',function(){
  localStorage.setItem(LS_INSTALL,'1');
  hideInstallBanner();
});

function maybeNudge(){
  if(view.name!=='home')return;
  var ib=document.getElementById('installBanner');
  if(ib&&ib.classList.contains('show'))return;   /* never stack on the install banner */
  if(!records.length)return;
  var snooze=parseInt(localStorage.getItem(LS_NUDGE)||'0',10);
  if(Date.now()<snooze)return;
  var last=cfg.settings.lastBackupAt;
  var due=!last||Date.now()-last>21*24*3600*1000;
  if(!due)return;
  var nb=document.getElementById('nudgeBanner');
  nb.innerHTML='<div class="row between"><div><strong>Back up your records</strong><div class="muted">It\u2019s been a while. Export a backup so nothing is lost.</div></div>'+
  '<div class="row"><button class="btn small" data-action="snoozeNudge">Later</button><button class="btn small primary" data-action="nudgeBackup">Back up</button></div></div>';
  nb.classList.add('show');
}

/* ============================================================
   EGS CORE — SHARE · v2
   Ported from Notebuilt, the reference v2 implementation. Do not
   edit this block per-app — only APP_NAME and SHARE_APP_LINE
   (near the top of the file) carry app-specific content.
   ============================================================ */

/* Feather "share-2", the glyph WFD uses — stroked currentColor so it takes
   the host app's icon colour. */
var EGS_SHARE_GLYPH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>';

function appShareUrl(){
  /* the app's own directory URL, never a deep link into any state */
  return location.origin+location.pathname.replace(/[^/]*$/,'');
}

/* The ONE share handler. Every entry point calls this — the header icon and
   the Privacy-page block both land here. It can only ever send the public app
   link: no record, photo, vehicle, driver, PIN or company setting is reachable
   from it, and keeping that true is the point. */
function doShareApp(){
  var url=appShareUrl();
  if(navigator.share){
    navigator.share({title:APP_NAME,text:SHARE_APP_LINE,url:url})
      .catch(function(err){
        if(err&&err.name==='AbortError')return;   /* user backed out — say nothing */
        shareAppClipboard(url);                   /* anything else: fall through */
      });
    return;
  }
  shareAppClipboard(url);
}

function shareAppClipboard(url){
  var line=SHARE_APP_LINE+' '+url;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(line).then(function(){toast('Link copied');})
      .catch(function(){shareAppFallback(line);});
  }else shareAppFallback(line);
}

/* clipboard refused (insecure context, permissions) — show the link instead of
   swallowing it, so there is always a way to get it out */
function shareAppFallback(line){
  showModal('<div class="stack"><h2>Share '+esc(APP_NAME)+'</h2>'+
    '<p class="muted">Copy this and send it on:</p>'+
    '<div class="card" style="word-break:break-all;font-size:13px;line-height:1.6">'+esc(line)+'</div>'+
    '<button class="btn" data-action="closeModal">Close</button></div>');
}

function toast(msg){
  var t=document.getElementById('toast');
  if(!t)return;
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t=setTimeout(function(){t.classList.remove('show');},1900);
}

/* ---------- modal ---------- */
function showModal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show');}
function hideModal(){document.getElementById('modal').classList.remove('show');}

/* ---------- actions ---------- */
var actions={
  applyUpdate:function(){if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration){navigator.serviceWorker.getRegistration().then(function(r){if(r&&r.waiting)r.waiting.postMessage('skip');location.reload();});}else location.reload();},
  showInfo:function(el){showModal('<p>'+esc(INFO[el.getAttribute('data-info')]||'')+'</p><button class="btn primary" data-action="closeModal">Got it</button>');},
  closeModal:hideModal,
  shareApp:function(){doShareApp();},
  installGo:function(){
    if(!deferredInstall){hideInstallBanner();return;}
    deferredInstall.prompt();
    deferredInstall.userChoice.then(function(){deferredInstall=null;hideInstallBanner();});
  },
  installDismiss:function(){localStorage.setItem(LS_INSTALL,'1');hideInstallBanner();},
  privacy:function(){go('privacy');},
  privacyM:function(){go('privacy');},
  goHome:function(){draft=null;go('home');},
  openMenu:function(){
    showModal('<div class="stack"><h2>Rollworthy</h2>'+
    '<button class="btn primary" data-action="mgrOpen">Manager tools'+'</button>'+
    '<button class="btn" data-action="importSetup">Import company setup / records</button>'+
    '<button class="btn" data-action="privacyModal">Privacy</button>'+
    '<button class="btn" data-action="closeModal">Close</button></div>');},
  privacyModal:function(){hideModal();go('privacy');},
  mgrOpen:function(){hideModal();if(pinGate())go('manager',{tab:'records'});},
  startSetup:function(){view={name:'setup',step:1,tmp:{vehicles:[],drivers:[],checklist:{light:DEFAULT_LIGHT.slice(),nsc:DEFAULT_NSC.slice(),checkin:DEFAULT_IN.slice()}}};render();},
  importSetup:function(){hideModal();importMode='any';document.getElementById('importInput').click();},
  setupNext1:function(){
    var c=document.getElementById('su_company').value.trim(),p=document.getElementById('su_pin').value.trim();
    if(!c){alert('Enter the company name.');return;}
    if(p.length<4){alert('PIN must be at least 4 digits.');return;}
    view.tmp.company=c;view.tmp.pin=p;view.step=2;render();},
  setupBack:function(el){view.step=parseInt(el.getAttribute('data-s'),10);render();},
  setupAddVeh:function(){
    var u=document.getElementById('su_unit').value.trim();
    if(!u){alert('Unit # is required.');return;}
    view.tmp.vehicles.push({id:uid(),unit:u,plate:document.getElementById('su_plate').value.trim(),
      desc:document.getElementById('su_desc').value.trim(),cls:document.getElementById('su_cls').value});
    render();},
  setupDelVeh:function(el){
    var i=parseInt(el.getAttribute('data-i'),10);
    if(confirm('Remove vehicle '+view.tmp.vehicles[i].unit+'?')){view.tmp.vehicles.splice(i,1);render();}},
  setupNext2:function(){if(!view.tmp.vehicles.length){alert('Add at least one vehicle.');return;}view.step=3;render();},
  setupAddDrv:function(){
    var d=document.getElementById('su_driver').value.trim();
    if(!d)return;view.tmp.drivers.push(d);render();},
  setupDelDrv:function(el){
    var i=parseInt(el.getAttribute('data-i'),10);
    if(confirm('Remove driver '+view.tmp.drivers[i]+'?')){view.tmp.drivers.splice(i,1);render();}},
  setupNext3:function(){if(!view.tmp.drivers.length){alert('Add at least one driver.');return;}view.step=4;render();},
  setupFinish:function(){
    cfg={schema:1,company:view.tmp.company,managerPin:view.tmp.pin,vehicles:view.tmp.vehicles,drivers:view.tmp.drivers,
      checklist:view.tmp.checklist,settings:{theme:'system',beginner:true,requireOdoPhoto:true,requireDefectPhoto:true,lastBackupAt:null}};
    saveCfg();go('home');},
  go:function(el){
    var d=document.getElementById('driverSel');
    if(d&&d.value)localStorage.setItem(LS_DRIVER,d.value);
    if(!localStorage.getItem(LS_DRIVER)){alert('Select your driver name first.');return;}
    go('pick',{type:el.getAttribute('data-type')});},
  pickVeh:function(el){startDraft(view.type,el.getAttribute('data-id'));},
  backToPick:function(){if(confirm('Leave this inspection? Nothing has been saved.')){var t=draft.type;draft=null;go('pick',{type:t});}},
  openScan:openScan, closeScan:closeScan,
  setFuel:function(el){collectDraftInputs();draft.fuel=el.getAttribute('data-v');render();},
  setItem:function(el){collectDraftInputs();var it=draft.items[parseInt(el.getAttribute('data-i'),10)];it.status=el.getAttribute('data-v');render();},
  odoPhoto:function(){collectDraftInputs();photoTarget={kind:'odo'};document.getElementById('photoInput').click();},
  itemPhoto:function(el){collectDraftInputs();photoTarget={kind:'item',i:parseInt(el.getAttribute('data-i'),10)};document.getElementById('photoInput').click();},
  saveRecord:function(){
    collectDraftInputs();
    if(!validateDraft())return;
    draft.driver=localStorage.getItem(LS_DRIVER)||draft.driver;
    draft.ts=Date.now();
    records.push(draft);saveRecords();
    var saved=draft;draft=null;
    go('done',{rec:saved});},
  shareRec:function(el){
    var id=el.getAttribute('data-id');
    var list=records.filter(function(r){return r.id===id;});
    shareRecords(list,true);},
  shareUnshared:function(){shareRecords(records.filter(function(r){return !r.shared;}),true);},
  openRec:function(el){go('recDetail',{id:el.getAttribute('data-id'),from:'home'});},
  openRecM:function(el){go('recDetail',{id:el.getAttribute('data-id'),from:'manager'});},
  backToManager:function(){go('manager',{tab:view.fromTab||'records'});},
  mgrTab:function(el){go('manager',{tab:el.getAttribute('data-t')});},
  exportCSV:exportCSV,
  importRecords:function(){importMode='any';document.getElementById('importInput').click();},
  resolveDef:function(el){
    var note=prompt('Resolution note (what was done):');
    if(note===null)return;
    resolutions[el.getAttribute('data-key')]={ts:Date.now(),note:note.trim()};
    saveRes();render();},
  addVeh:function(){
    var u=document.getElementById('m_unit').value.trim();
    if(!u){alert('Unit # is required.');return;}
    cfg.vehicles.push({id:uid(),unit:u,plate:document.getElementById('m_plate').value.trim(),
      desc:document.getElementById('m_desc').value.trim(),cls:document.getElementById('m_cls').value});
    saveCfg();render();},
  delVeh:function(el){
    var i=parseInt(el.getAttribute('data-i'),10);
    if(confirm('Delete vehicle '+cfg.vehicles[i].unit+'? Its past records are kept.')){cfg.vehicles.splice(i,1);saveCfg();render();}},
  addDrv:function(){
    var d=document.getElementById('c_driver').value.trim();
    if(!d)return;cfg.drivers.push(d);saveCfg();render();},
  delDrv:function(el){
    var i=parseInt(el.getAttribute('data-i'),10);
    if(confirm('Remove driver '+cfg.drivers[i]+'?')){cfg.drivers.splice(i,1);saveCfg();render();}},
  addChk:function(el){
    var k=el.getAttribute('data-k'),inp=document.getElementById('chkAdd_'+k);
    var v=inp.value.trim();if(!v)return;cfg.checklist[k].push(v);saveCfg();render();},
  delChk:function(el){
    var k=el.getAttribute('data-k'),i=parseInt(el.getAttribute('data-i'),10);
    if(confirm('Remove checklist item "'+cfg.checklist[k][i]+'"?')){cfg.checklist[k].splice(i,1);saveCfg();render();}},
  saveCompany:function(){cfg.company=document.getElementById('c_company').value.trim()||cfg.company;saveCfg();render();},
  changePin:function(){
    var old=prompt('Current PIN:');if(old===null)return;
    if(old!==cfg.managerPin){alert('Wrong PIN.');return;}
    var np=prompt('New PIN (4+ digits):');if(np===null)return;
    if(np.trim().length<4){alert('Too short.');return;}
    cfg.managerPin=np.trim();saveCfg();alert('PIN changed.');},
  toggleOdoPhoto:function(el){cfg.settings.requireOdoPhoto=el.checked;saveCfg();},
  toggleDefPhoto:function(el){cfg.settings.requireDefectPhoto=el.checked;saveCfg();},
  toggleBeginner:function(el){cfg.settings.beginner=el.checked;saveCfg();applyTheme();},
  setTheme:function(el){cfg.settings.theme=el.value;saveCfg();applyTheme();},
  exportSetup:exportSetup,
  backupAll:backupAll,
  nudgeBackup:function(){if(pinGate())backupAll();},
  snoozeNudge:function(){localStorage.setItem(LS_NUDGE,String(Date.now()+7*24*3600*1000));document.getElementById('nudgeBanner').classList.remove('show');},
  restoreAll:function(){importMode='any';document.getElementById('importInput').click();},
  printStickers:printStickers
};

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-action]');
  if(!el)return;
  var fn=actions[el.getAttribute('data-action')];
  if(fn){e.preventDefault();fn(el);}
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='vehSearch'){view.q=el.value;render();var s=document.getElementById('vehSearch');if(s){s.focus();}}
  if(el.id==='driverSel'&&el.value)localStorage.setItem(LS_DRIVER,el.value);
  if(el.id==='photoInput'&&el.files&&el.files[0]){
    var f=el.files[0];el.value='';
    downscale(f).then(function(blob){
      if(!blob){alert('Could not read that photo.');return;}
      var id=uid();
      putPhoto(id,blob).then(function(){
        if(photoTarget&&photoTarget.kind==='odo')draft.odoPhotoId=id;
        else if(photoTarget&&photoTarget.kind==='item')draft.items[photoTarget.i].photoId=id;
        photoTarget=null;render();
      });
    });
  }
  if(el.id==='importInput'&&el.files&&el.files[0]){var f2=el.files[0];el.value='';handleImport(f2);}
  var act=el.getAttribute&&el.getAttribute('data-action');
  if(act&&(el.type==='checkbox'||el.tagName==='SELECT')&&actions[act])actions[act](el);
});
document.addEventListener('input',function(e){
  if(e.target.id==='vehSearch'){view.q=e.target.value;
    /* live filter without full re-render focus loss: simple re-render is fine on change; skip on input */}
});
document.getElementById('modal').addEventListener('click',function(e){if(e.target.id==='modal')hideModal();});

/* ---------- boot ---------- */
loadAll();
render();
})();
</script>
